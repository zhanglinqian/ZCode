<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Fen Jue 数据迁移</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c1c1e;
        color: #e8e8ea;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f5f5f7;
          color: #1d1d1f;
        }
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 0 28px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 14px;
      }
      .phase {
        font-size: 13px;
        margin-bottom: 10px;
        min-height: 18px;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(128, 128, 128, 0.28);
        overflow: hidden;
        margin-bottom: 10px;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: #0a84ff;
        transition: width 0.2s ease-out;
      }
      .bar-fill.indeterminate {
        width: 100%;
        background: linear-gradient(90deg, transparent, #0a84ff, transparent);
        animation: sweep 1.2s linear infinite;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar-fill.indeterminate {
          animation: none;
          background: #0a84ff;
        }
      }
      .counts {
        font-size: 12px;
        color: #98989d;
        margin-bottom: 18px;
        font-variant-numeric: tabular-nums;
      }
      .detail {
        font-size: 12px;
        color: #98989d;
        line-height: 1.6;
        margin-bottom: 18px;
      }
      .detail code {
        font-size: 11px;
        color: #98989d;
      }
      .error {
        color: #ff6b60;
        font-size: 12px;
        margin-bottom: 18px;
        word-break: break-all;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      button {
        font: inherit;
        padding: 7px 18px;
        border-radius: 8px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #0a84ff;
        border-color: #0a84ff;
        color: #fff;
      }
      button.primary:hover {
        background: #3395ff;
      }
      button:hover {
        border-color: #0a84ff;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">迁移官方 ZCode 数据</h1>
      <div class="phase" id="phase">准备迁移…</div>
      <div class="bar"><div class="bar-fill indeterminate" id="barFill"></div></div>
      <div class="counts" id="counts"></div>
      <div class="detail hidden" id="doneDetail">
        已切换到官方 ZCode 的历史与配置，重启后生效。Fen Jue 原数据保留为可恢复备份（设置 → 数据同步）。
      </div>
      <div class="error hidden" id="errorDetail"></div>
      <div class="actions">
        <button id="quitBtn" class="hidden">退出</button>
        <button id="restartBtn" class="primary hidden">重启应用</button>
      </div>
    </div>
    <script type="module" src="./officialDataImport.ts"></script>
  </body>
</html>
